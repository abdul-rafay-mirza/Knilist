name: Build and Publish Flatpak

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
        shell: bash

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import
        shell: bash

      - name: Install PySide BaseApp
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --system -y flathub io.qt.PySide.BaseApp//6.11
        shell: bash

      - name: Compute versioned bundle filename
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          # v0.1.0 -> v_0_1_0
          SUFFIX="${TAG//./_}"
          SUFFIX="${SUFFIX/v/v_}"
          echo "bundle_name=knilist_${SUFFIX}.flatpak" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ steps.version.outputs.bundle_name }}
          manifest-path: com.github.abdulrafaymirza.knilist.json
          gpg-sign: ${{ secrets.GPG_KEY_ID }}
          repo-dir: repo
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload bundle to release
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "${{ steps.version.outputs.bundle_name }}" --clobber
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Pages repo
        uses: actions/checkout@v4
        with:
          repository: abdul-rafay-mirza/knilist-flatpak
          token: ${{ secrets.FLATPAK_REPO_PAT }}
          path: knilist-flatpak

      - name: Sync repo into Pages checkout
        run: |
          rm -rf knilist-flatpak/repo
          mkdir -p knilist-flatpak/repo
          cp -a repo/. knilist-flatpak/repo/
        shell: bash

      - name: Commit and push
        working-directory: knilist-flatpak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo/
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Automated repo update from ${{ github.sha }}"
            git push
          fi
        shell: bash
